# Следует располагать CI/CD пайплайны в этой директории. Ниже - пример.
name: Lint & Format

on:
  push:
    branches: [dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"

permissions:
  contents: write

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip & install Ruff
        run: |
          python -m pip install -U pip
          pip install "ruff==0.6.8"

      - name: Ruff Format
        run: ruff format .

      - name: Fix import order
        run: ruff check --select I --fix .

      - name: Detect changes after format
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted code
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[CI] reformat: auto-format with ruff"
          git push
