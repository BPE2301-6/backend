name: tests

on:
  push:
    branches: [ dev, main ]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🧪 **Запуск тестов**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            Автор: `${{ github.actor }}`
            Триггер: `${{ github.event_name }}`
            🔗 [Открыть workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: sync deps (dev + extras)
        run: uv sync --dev --all-extras

      - name: run tests (treat exit code 5 as success)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          set +e

          uv run pytest tests -vv -ra --maxfail=1 --durations=10 -s 2>&1 | tee pytest-logs.txt
          status=${PIPESTATUS[0]}

          set -e

          if [ "$status" -eq 5 ]; then
            echo "pytest: no tests collected (exit code 5) — считаем это успехом пока нет тестов"
            exit 0
          fi

          exit "$status"
        shell: bash

      - name: upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: pytest-logs.txt
          if-no-files-found: ignore

      - name: Notify Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ **Тесты пройдены успешно**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            🔗 [Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ **Тесты упали**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            Автор: `${{ github.actor }}`
            🔗 [Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
