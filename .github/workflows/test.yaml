name: tests

on:
  push:
    branches: [ dev, main ]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: sync deps (dev + extras)
        run: uv sync --dev --all-extras

      - name: run tests (verbose log)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          uv run pytest tests -vv -ra --maxfail=1 --durations=10 -s 2>&1 | tee pytest-logs.txt
          exit ${PIPESTATUS[0]}

      - name: upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: pytest-logs.txt
          if-no-files-found: ignore
